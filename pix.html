<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento com PIX</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: rgb(223, 31, 31);
            font-weight: bold;
            margin: 0;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #fff;
        }

        form {
            max-width: 400px;
            background-color: #fff;
            padding: 30px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
            color: #000;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #000;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            background-color: rgb(247, 37, 37);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: rgb(250, 98, 98);
        }

        #resultado {
            max-width: 600px;
            margin: 30px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #000;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
</style>
</head>
<body>
    <div>
        <h2>Pagamento com PIX</h2>

        <form onsubmit="simularPix(event)">
            <label>ID do Cliente:</label>
            <input type="text" id="customerId" value="">

            <label>Valor:</label>
            <input type="text" id="valor" value="1000">

            <button type="submit">Simular PIX</button>

            <pre id="resultado"></pre>
            
            <a href="./index.html">
                <button type="button">Voltar</button>
            </a>
        </form>

    </div>

    <script>
        async function simularPix(event) {
        event.preventDefault();

        const token = sessionStorage.getItem('access_token');
        const sellerId = sessionStorage.getItem('seller_id');

        if (!token || !sellerId) {
            alert("Volte à página inicial e gere um token.");
            return;
        }

        const body = {
            seller_id: sellerId,
            payment: {
                payment_method: "pix",
                amount: {
                currency: "BRL",
                value: valor
                },
                order: {
                order_id: "pedido123"
                },
                customer: {
                customer_id: customerId
                }
            }
        };



        const res = await fetch("https://api-homologacao.getnet.com.br/v1/payments/pix", {
            method: "POST",
            headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json",
            "seller_id": sellerId
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();
        document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
