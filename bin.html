<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Bin</title>
    <link rel="stylesheet" href="./source/bin.css">
</head>
<body>
    <header>
        <h1>Consulta bin</h1>
    </header>
    <div class="container">
        <form onsubmit="consultarBin(event)">
        <input type="text" id="cardBin" placeholder="Digite os 6 primeiros dígitos" maxlength="6" minlength="6" required />
        <button type="submit">Consultar</button>
        </form>

        <div class="info-group">
        <div>
            <label for="bin">Bin:</label>
            <pre id="bin"></pre>
        </div>
        <div>
            <label for="brand">Brand:</label>
            <pre id="brand"></pre>
        </div>
        <div>
            <label for="brand_code">Brand code:</label>
            <pre id="brand_code"></pre>
        </div>
        <div>
            <label for="brazilian_issued">Brazilian issued:</label>
            <pre id="brazilian_issued"></pre>
        </div>
        <div>
            <label for="country">Country:</label>
            <pre id="country"></pre>
        </div>
        <div>
            <label for="country_code">Country code:</label>
            <pre id="country_code"></pre>
        </div>
        <div>
            <label for="country_code_iso">Country code iso:</label>
            <pre id="country_code_iso"></pre>
        </div>
        <div>
            <label for="issuer">Issuer:</label>
            <pre id="issuer"></pre>
        </div>
        <div>
            <label for="product">Product:</label>
            <pre id="product"></pre>
        </div>
        <div>
            <label for="type">Type:</label>
            <pre id="type"></pre>
        </div>
        </div>
        <a id="voltar" href="./cartao.html">
            <button type="button">voltar</button>
        </a>
    </div>

    <script>
        async function consultarBin(event) {
            event.preventDefault();

            const bin = document.getElementById('cardBin').value.trim();
            const token = sessionStorage.getItem('access_token');
            const sellerId = sessionStorage.getItem('seller_id');

            if (!token || !sellerId) {
                alert("Token ou Seller ID ausente. Volte à página de autenticação.");
                return;
            }

            if (bin.length !== 6) {
                alert("Digite exatamente 6 dígitos.");
                return;
            }

            try {
                const response = await fetch(`/api/bin?bin=${bin}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'seller_id': sellerId
                }
                });

                const contentType = response.headers.get("Content-Type");

                if (!response.ok) {
                const errorText = await response.text();
                console.error("Erro da API:", response.status, errorText);
                alert(`Erro ${response.status}:\n${errorText}`);
                return;
                }

                if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                alert("Resposta inesperada da API:\n\n" + text);
                return;
                }

                const data = await response.json();

                if (!data || !data.results || data.results.length === 0) {
                alert("BIN não encontrado.");
                return;
                }

                const info = data.results[0];

                document.getElementById('bin').textContent = info.bin || "";
                document.getElementById('brand').textContent = info.brand || "";
                document.getElementById('brand_code').textContent = info.brand_code || "";
                document.getElementById('brazilian_issued').textContent = info.brazilian_issued ? "Sim" : "Não";
                document.getElementById('country').textContent = info.country || "";
                document.getElementById('country_code').textContent = info.country_code || "";
                document.getElementById('country_code_iso').textContent = info.country_code_iso || "";
                document.getElementById('issuer').textContent = info.issuer || "";
                document.getElementById('product').textContent = info.product || "";
                document.getElementById('type').textContent = info.type || "";

            } catch (error) {
                alert("Erro ao consultar o BIN: " + error.message);
            }
        }
    </script>
</body>
</html>
