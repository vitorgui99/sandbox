<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ambiente de Teste - Getnet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./source/index.css">
</head>
<body>
    <div class="container">
        <h2>Sandbox 2.0</h2>

        <label for="sellerId">Seller ID:</label>
        <input type="text" id="sellerId" placeholder="Digite seu Seller ID">

        <label for="clientId">Client ID:</label>
        <input type="text" id="clientId" placeholder="Digite seu Client ID">

        <label for="clientSecret">Client Secret:</label>
        <input type="text" id="clientSecret" placeholder="Digite seu Client Secret">

        <button onclick="gerarToken()">Gerar Access Token</button>

        <pre id="output">Token será exibido aqui...</pre>

        <hr>

        <h3>Escolha o Método de Pagamento:</h3>
        <button onclick="irPara('cartao.html')">Pagamento com Cartão</button>
        <button onclick="irPara('pix.html')">Pagamento com PIX</button>
        <button onclick="irPara('boleto.html')">Pagamento por Boleto</button>
    </div>

    <script>
        function gerarToken() {
            const sellerId = document.getElementById('sellerId').value;
            const clientId = document.getElementById('clientId').value;
            const clientSecret = document.getElementById('clientSecret').value;

            if (!sellerId || !clientSecret || !clientId) {
                alert("Preencha todas as credenciais.");
                return;
            }

            const auth = btoa(`${clientId}:${clientSecret}`);
            const body = new URLSearchParams();
            body.append('grant_type', 'client_credentials');

            fetch('https://api-homologacao.getnet.com.br/auth/oauth/v2/token', {
                method: 'POST',
                headers: {
                    'Authorization': `Basic ${auth}`,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                sessionStorage.setItem('access_token', data.access_token);
                sessionStorage.setItem('client_id', clientId);
                sessionStorage.setItem('client_secret', clientSecret);
                sessionStorage.setItem('seller_id', sellerId);
            })
            .catch(err => {
                document.getElementById('output').textContent = "Erro: " + err;
            });
        }

        function irPara(pagina) {
            const token = sessionStorage.getItem('access_token');
            const sellerId = sessionStorage.getItem('seller_id');

            if (!token || !sellerId) {
                alert("Você precisa gerar o token antes de continuar.");
                return;
            }

            window.location.href = pagina;
        }
    </script>
    <footer>
        <p>
        <small>
            Copyright &copy; 2025 - victorDEV
        </small>
        </p>
    </footer>
</body>
</html>
