<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Cartão</title>
    <style>
        * {
        box-sizing: border-box;
        font-weight: bold;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(223, 31, 31);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .container {
        background-color: white;
        max-width: 600px;
        width: 100%;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 6px;
        margin-top: 5px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid rgba(0, 0, 0, 0.1);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid rgb(247, 37, 37);
    }

    button {
        background-color: rgb(223, 31, 31);
        color: white;
        border: none;
        margin-top: 20px;
        transition: background-color 0.3s ease;
        cursor: pointer;
    }

    button:hover {
        background-color: rgb(250, 98, 98);
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verificação de Cartão</h1>
        <label for="verifycard">Digite os dados do Cartão:</label>
        <input name="verifycard" type="text">
        <button type="button">Verificar</button>
        <a href="./cartao.html">
            <button type="button">Voltar</button>
        </a>
    </div>
</body>
</html>
