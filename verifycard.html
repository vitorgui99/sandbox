<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verifique seu Cartão</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./source/verifycard.css">
    </head>
    <body>
    <div class="container">
        <h1>Verificação de Cartão</h1>

        <input type="text" id="token" placeholder="Número do Cartão">
        <input type="text" id="nome" placeholder="Nome impresso no cartão">
        <input type="text" id="mes" placeholder="Mês de validade (2 dígitos)">
        <input type="text" id="ano" placeholder="Ano de validade (2 dígitos)">
        <input type="text" id="cvv" placeholder="Código de segurança (CVV)">
        <input type="text" id="bandeira" placeholder="Bandeira (visa, mastercard...)">

        <pre id="output">O status será exibido aqui...</pre>
        
        <button onclick="verificarCartao()">Verificar</button>
        <br><br>
        <a href="cartao.html"><button>Voltar</button></a>
    </div>

    <script>
        async function verificarCartao() {
        const token = sessionStorage.getItem('access_token');
        const sellerId = sessionStorage.getItem('seller_id');
        const output = document.getElementById("output");

        if (!token || !sellerId) {
            output.textContent = "⚠️ Gere o token na página inicial antes de continuar.";
            return;
        }

        const numberToken = document.getElementById("token").value.trim();
        const cardholderName = document.getElementById("nome").value.trim();
        const expirationMonth = document.getElementById("mes").value.trim();
        let expirationYear = document.getElementById("ano").value.trim();
            if (expirationYear.length === 4) {
            expirationYear = expirationYear.substring(2); // Usa apenas os dois últimos dígitos
            }
        const securityCode = document.getElementById("cvv").value.trim();
        const brand = document.getElementById("bandeira").value.trim().toLowerCase();

        if (!numberToken || !cardholderName || !expirationMonth || !expirationYear || !securityCode || !brand) {
            output.textContent = "⚠️ Preencha todos os campos obrigatórios.";
            return;
        }

        const body = {
            seller_id: sellerId,
            card: {
            number_token: numberToken,
            expiration_month: expirationMonth,
            expiration_year: expirationYear,
            cardholder_name: cardholderName,
            security_code: securityCode,
            brand: brand
            }
        };

        try {
            const res = await fetch("https://api-homologacao.getnet.com.br/v1/cards/verification", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
            });

            const data = await res.json();
            output.textContent = JSON.stringify(data, null, 2);
        } catch (erro) {
            output.textContent = "❌ Erro ao verificar cartão: " + erro.message;
        }
        }
    </script>
</body>
</html>
