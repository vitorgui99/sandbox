<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tokenização do Cartão</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(223, 31, 31);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            background-color: white;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: rgb(223, 31, 31);
            color: white;
            border: none;
            margin-top: 20px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(250, 98, 98);
        }

        pre {
            background-color: #f6f8fa;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tokenização do Cartão</h2>

        <form onsubmit="tokenizarCartao(event)">
            <label>Número do Cartão:</label>
            <input type="text" id="cardNumber" value="">

            <label>ID do Cliente:</label>
            <input type="text" id="customerId" value="">
            <button type="submit">Tokenizar Cartão</button>
            <div>
                <label for="Response">Response:</label>
                <pre name="Response" id="resultado"></pre>
            </div>
        </form>
        <a href="./verifycard.html">
            <button type="submit">Verificação de Cartão</button>
        </a>
        <button onclick="irParaPagamento()">Ir para Pagamento</button>
        <a href="./index.html">
            <button type="submit">Voltar</button>
        </a>
    </div>

    <script>
        async function tokenizarCartao(event) {
            event.preventDefault();

            const token = sessionStorage.getItem('access_token');
            const sellerId = sessionStorage.getItem('seller_id');

            if (!token || !sellerId) {
                alert("Token ou Seller ID ausente. Volte à página inicial.");
                return;
            }

            const body = {
                card_number: document.getElementById('cardNumber').value,
                customer_id: document.getElementById('customerId').value
            };

            const res = await fetch("https://api-homologacao.getnet.com.br/v1/tokens/card", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json",
                    "seller_id": sellerId
                },
                body: JSON.stringify(body)
            });

            const data = await res.json();
            document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
        }

        function irParaPagamento() {
            const resultado = JSON.parse(document.getElementById("resultado").textContent || "{}");
            if (!resultado.number_token) {
                alert("Token do cartão ainda não gerado.");
                return;
            }
            sessionStorage.setItem("number_token", resultado.number_token);
            window.location.href = "pagamento.html";
        }
    </script>
</body>
</html>
